services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: niv
      POSTGRES_PASSWORD: niv_password
      POSTGRES_DB: niv
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niv -d niv"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://niv:niv_password@postgres:5432/niv
      REDIS_URL: redis://redis:6379/0
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  customer-bot:
    build: .
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
      REDIS_URL: redis://redis:6379/0
    command: python -m bots.customer.main
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  management-bot:
    build: .
    env_file: .env
    environment:
      MANAGEMENT_BOT_BACKEND_URL: http://backend:8000
      REDIS_URL: redis://redis:6379/0
    command: python -m bots.management.main
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://niv:niv_password@postgres:5432/niv
    command: python -m app.worker.main
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
