[project]
name = "niv-reservation"
version = "0.1.0"
description = "NIV café-restaurant smart reservation system"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0.30,<2.1",
  "alembic>=1.13,<2.0",
  "asyncpg>=0.29,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "redis>=5.0,<6.0",
  "jdatetime>=5.0,<6.0",
  "tzdata>=2024.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27,<1.0",
  "aiogram>=3.13,<4.0",
  "openpyxl>=3.1,<4.0",
  "boto3>=1.34,<2.0",
  "aiohttp>=3.9,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "httpx>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
